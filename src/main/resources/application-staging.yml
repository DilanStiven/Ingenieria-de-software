spring:
  datasource:
    url: ${DB_URL_VAR}
    username: ${DB_USER_VAR}
    password: ${DB_PASS_VAR}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 3

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET_VAR}
  expiration-ms: 86400000
