spring.application.name=agrovalle-connect

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/agrovalle_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3

jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-agrovalle-connect-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
