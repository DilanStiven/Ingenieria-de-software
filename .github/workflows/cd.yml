name: Continuous Deployment (CD) - Staging Pipeline

on:
  push:
    branches: [ main ]

jobs:
  verify-and-test:
    name: Verification & Quality Gates (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecución a mvnw
        run: chmod +x mvnw

      - name: Build, Linter & Unit Tests with JaCoCo
        run: ./mvnw clean verify

      - name: Verify JaCoCo Coverage Threshold (>= 60%)
        run: ./mvnw jacoco:check

  deploy-to-staging:
    name: Deploy Application to Staging Cloud
    needs: verify-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Staging Deployment Webhook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::DEPLOY_HOOK_URL no está configurado en GitHub Secrets"
            exit 1
          fi
          echo "Ejecutando despliegue automático al ambiente Staging..."
          curl --fail --silent --show-error --location --request POST "$DEPLOY_HOOK_URL"
