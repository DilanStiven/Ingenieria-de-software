steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos de ejecucion a Maven Wrapper
        run: chmod +x mvnw

      - name: 1. Compilar proyecto
        run: ./mvnw clean compile

      - name: 2. Verificar estilo con Checkstyle
        run: ./mvnw checkstyle:check

      - name: 3. Ejecutar pruebas y verificar Cobertura JaCoCo (>= 60%)
        run: ./mvnw test jacoco:check
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/agrovalle_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ci_password
