name: CI Pipeline - AgroValle Connect

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build, Checkstyle & JaCoCo Coverage
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 3. Dar permisos de ejecución a mvnw
        run: chmod +x mvnw

      - name: 4. Paso 1 — Compilación Limpia
        run: ./mvnw clean compile

      - name: 5. Paso 2 — Verificación de Linter (Checkstyle)
        run: ./mvnw checkstyle:check

      - name: 6. Paso 3 — Pruebas Unitarias y Cobertura JaCoCo
        run: ./mvnw verify

      - name: 7. Subir Reporte de Cobertura JaCoCo como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
